[package]
name = "marksunzun"
version = "0.1.0"
description = "A quiet, local-first Markdown reader"
edition = "2021"

[lib]
name = "marksunzun_lib"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
notify = "8"
pulldown-cmark = "0.13"
base64 = "0.22"
open = "5"
url = "2"
